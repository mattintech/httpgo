name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Public GitHub only; the private Gitea mirror has its own pipeline.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
